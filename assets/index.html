<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    :root { --outline-motion-duration: .24s; --outline-motion-ease: cubic-bezier(.22, 1, .36, 1); --ui-surface: #fff; --ui-surface-subtle: #f7f7f8; --ui-border: #e5e5e5; --ui-border-strong: #d1d5db; --ui-text: #2f2f2f; --ui-text-muted: #6b6b6b; --ui-hover: #f1f1f1; --ui-active: #e8e8e8; --ui-primary: #3b82f6; --ui-primary-strong: #2563eb; color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ui-text); background: var(--ui-surface); }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; background: var(--ui-surface); }
    header { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px 16px; padding: 14px 20px; background: var(--ui-surface); border-bottom: 1px solid var(--ui-border); position: sticky; top: 0; z-index: 2; }
    header.more-open { z-index: 4; }

    button { border: 1px solid var(--ui-border); border-radius: 7px; background: var(--ui-surface); color: var(--ui-text); padding: 7px 11px; cursor: pointer; }

    .toolbar .icon-button { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 7px; border: 0; border-radius: 50%; background: transparent; transition: background-color .15s ease, color .15s ease; }
    .toolbar .icon-button:hover, .toolbar .icon-button:focus-visible { background: var(--ui-hover); color: var(--ui-text); }
    .toolbar .icon-button:active { background: var(--ui-active); }

    .toolbar .icon-button:disabled:hover { background: transparent; }
    #undo-button .mode-icon, #redo-button .mode-icon { width: 16px; height: 16px; fill: currentColor; stroke: none; }
    .more-menu { position: relative; }
    .more-options { position: absolute; top: calc(100% + 6px); right: 0; display: grid; gap: 4px; min-width: 150px; padding: 6px; background: var(--ui-surface); border: 1px solid var(--ui-border); border-radius: 8px; box-shadow: 0 8px 20px rgba(15, 23, 42, .12); z-index: 3; }

    .more-options button:hover { background: var(--ui-hover); }
    .document-menu, .archive-menu { position: relative; }
    .document-menu-options, .archive-menu-options { position: absolute; top: calc(100% + 6px); right: 0; display: grid; gap: 2px; min-width: 220px; max-width: min(360px, 80vw); max-height: min(60vh, 360px); overflow-y: auto; padding: 6px; background: var(--ui-surface); border: 1px solid var(--ui-border); border-radius: 8px; box-shadow: 0 8px 20px rgba(15, 23, 42, .12); z-index: 3; }
    .document-menu-option { display: flex; align-items: center; gap: 2px; border-radius: 7px; }

    .document-menu-delete { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 16px; height: 16px; margin-right: 3px; border: 0; border-radius: 50%; padding: 0; background: #9ca3af; color: #fff; opacity: 0; pointer-events: none; font-size: 12px; line-height: 1; }
    .document-menu-option:hover .document-menu-delete, .document-menu-option:focus-within .document-menu-delete { opacity: 1; pointer-events: auto; }
    .document-menu-delete:hover, .document-menu-delete:focus-visible { background: #6b7280; }

    .document-menu-delete .mode-icon, .document-menu-restore .mode-icon { width: 16px; height: 16px; fill: currentColor; stroke: none; }
    .document-menu-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .document-menu-archive-actions { display: flex; flex: 0 0 auto; gap: 3px; margin-right: 3px; }
    .document-menu-restore { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 16px; height: 16px; margin-right: 3px; border: 0; border-radius: 50%; padding: 0; background: transparent; color: var(--ui-text-muted); opacity: 0; pointer-events: none; }
    .document-menu-archived:hover .document-menu-restore, .document-menu-archived:focus-within .document-menu-restore { opacity: 1; pointer-events: auto; }
    .document-menu-restore:hover, .document-menu-restore:focus-visible { background: var(--ui-hover); color: var(--ui-text); }
    .archive-menu-empty { min-height: 32px; padding: 4px 8px; color: var(--ui-text-muted); font-size: 14px; line-height: 1.4; }
    .document-menu-review { width: 6px; height: 6px; border-radius: 50%; background: var(--ui-primary); }
    .mode-icon { display: block; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .document-menu .mode-icon, .archive-menu .mode-icon, #more-toggle .mode-icon, #copy-button .mode-icon { width: 16px; height: 16px; }
    .document-menu .mode-icon, .archive-menu .mode-icon, #more-toggle .mode-icon { fill: currentColor; stroke: none; }
    #status { margin-left: auto; overflow: hidden; color: var(--ui-text-muted); font-size: 13px; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    #status:empty { display: none; }
    #reload-latest { display: none; }

    .selection-format-handle { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; color: var(--ui-text-muted); }
    .selection-format-handle svg { display: block; width: 16px; height: 16px; fill: currentColor; }
    .selection-format-button { min-width: 30px; height: 30px; padding: 4px 8px; border: 0; border-radius: 10px; font-size: 15px; line-height: 1; }
    .selection-format-button svg { display: block; width: 16px; height: 16px; }
    .selection-format-button:hover, .selection-format-button:focus-visible, .selection-format-button[aria-pressed="true"] { background: var(--ui-hover); }
    .selection-format-button:active { background: var(--ui-active); }
    .selection-format-menu-wrap { position: relative; }
    .selection-format-menu-toggle { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 4px 9px; border: 0; border-radius: 10px; background: transparent; font-size: 15px; white-space: nowrap; }
    .selection-format-menu-toggle:hover, .selection-format-menu-toggle:focus-visible, .selection-format-menu-toggle[aria-expanded="true"] { background: var(--ui-hover); outline: none; }
    .selection-format-chevron { display: block; flex: 0 0 auto; width: 14px; height: 14px; color: var(--ui-text-muted); }
    .selection-format-chevron path { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    .selection-format-menu { position: absolute; top: calc(100% + 8px); right: 0; display: grid; gap: 1px; min-width: 180px; max-width: min(280px, calc(100vw - 16px)); padding: 5px; border: 1px solid var(--ui-border-strong); border-radius: 14px; background: var(--ui-surface); box-shadow: 0 8px 20px rgba(15, 23, 42, .16); overflow-y: auto; }
    .selection-format-menu.opens-up { top: auto; bottom: calc(100% + 8px); }
    .selection-format-menu button { width: 100%; padding: 6px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font-size: 15px; line-height: 1.35; }
    .selection-format-menu button[data-format^="H"] { font-weight: 700; }
    .selection-format-menu button:hover, .selection-format-menu button:focus-visible, .selection-format-menu button[aria-current="true"] { background: var(--ui-hover); outline: none; }
    main { display: block; position: relative; padding: 16px; max-width: 1200px; margin: 0 auto; transition: grid-template-columns var(--outline-motion-duration) var(--outline-motion-ease); }
    .outline-sidebar { min-width: 0; position: absolute; top: 16px; left: 16px; width: min(280px, calc(100% - 32px)); z-index: 1; overflow: visible; transition: width var(--outline-motion-duration) var(--outline-motion-ease), transform var(--outline-motion-duration) var(--outline-motion-ease), box-shadow var(--outline-motion-duration) var(--outline-motion-ease); }
    .outline-toggle { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 7px; border: 0; border-radius: 50%; background: transparent; color: var(--ui-text); }
    .outline-toggle:hover, .outline-toggle:focus-visible { background: var(--ui-hover); color: var(--ui-text); }
    .outline-toggle:active { background: var(--ui-active); }
    .outline-toggle .mode-icon { width: 20px; height: 20px; }
    .outline-mobile-icon { display: none; }
    .outline-toggle .mode-icon[hidden] { display: none; }
    .outline-toggle .outline-collapsed-icon { fill: currentColor; stroke: none; }
    .outline-panel { position: absolute; top: 44px; right: 0; left: 0; max-height: calc(100vh - 116px); overflow: hidden; padding: 10px 8px 10px 0; opacity: 0; clip-path: inset(0 100% 0 0); visibility: hidden; pointer-events: none; transition: clip-path var(--outline-motion-duration) var(--outline-motion-ease), opacity var(--outline-motion-duration) var(--outline-motion-ease), visibility 0s linear var(--outline-motion-duration); }
    main.outline-open .outline-panel { overflow-y: auto; opacity: 1; clip-path: inset(0); visibility: visible; pointer-events: auto; transition-delay: 0s; }
    .outline-list { display: grid; gap: 2px; }
    .outline-item { width: 100%; min-width: 0; padding: 6px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--ui-text-muted); font-size: 14px; line-height: 1.4; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .outline-item:hover, .outline-item:focus-visible, .outline-item.active { background: var(--ui-hover); color: var(--ui-text); }
    .outline-item.active { font-weight: 600; }
    .outline-empty { padding: 8px; color: #94a3b8; font-size: 14px; }
    .workspace { width: 100%; max-width: 210mm; margin: 0 auto; padding: 0 1px; background: var(--ui-surface); border: 0; border-radius: 10px; box-shadow: none; min-height: calc(100vh - 90px); overflow: hidden; }
    article { padding: 26px 30px; min-height: calc(100vh - 122px); line-height: 1.75; overflow-wrap: anywhere; }
    .canvas-block { display: flow-root; border-radius: 8px; cursor: text; }
    .canvas-block:hover { background: transparent; }
    .canvas-block:focus-visible { outline: none; }
    .canvas-block.editing { background: transparent; box-shadow: none; }
    .canvas-block[contenteditable="true"] { cursor: text; }
    .canvas-block[contenteditable="true"]:focus { outline: none; }
    .canvas-block[data-block-index="0"] > p { min-height: 1.75em; margin: 0; }
    .canvas-block + .canvas-block > p { margin-top: 12px; }
    .canvas-block.body-placeholder > p { min-height: 1.75em; margin: 12px 0 0; }
    .canvas-block.body-placeholder:not([contenteditable="true"]) > p::before { content: '点击此处输入正文'; color: #a0a6b1; }
    .canvas-code-host { position: relative; }
    .canvas-code-actions { position: absolute; top: 20px; right: 8px; display: flex; gap: 4px; z-index: 1; }
    .canvas-code-actions button { padding: 4px 8px; border: 0; border-radius: 5px; background: rgba(255, 255, 255, .12); color: #e5e7eb; font-size: 12px; line-height: 1.2; }
    .canvas-code-actions button:hover, .canvas-code-actions button:focus-visible { background: rgba(255, 255, 255, .24); outline: none; }
    .document-empty-state { padding: 48px 20px; color: var(--ui-text-muted); text-align: center; }
    .document-empty-state-icon { display: block; width: 40px; height: 40px; margin: 0 auto 14px; color: #c5cad3; }
    .review-change { position: relative; margin: 36px 0 22px; padding-top: 26px; }
    .review-actions { position: absolute; top: 0; left: 50%; display: flex; gap: 4px; padding: 7px; border: 1px solid var(--ui-border-strong); border-radius: 18px; background: var(--ui-surface); box-shadow: 0 4px 12px rgba(15, 23, 42, .14); transform: translate(-50%, -50%); z-index: 1; }
    .review-actions button { border: 0; border-radius: 13px; padding: 7px 13px; background: transparent; font-size: 15px; font-weight: 600; }
    .review-actions button:hover { background: var(--ui-hover); }
    .review-actions .accept { background: var(--ui-primary); color: #fff; }
    .review-actions .accept:hover { background: var(--ui-primary-strong); }
    .review-actions button:disabled { opacity: .55; cursor: default; }
    .review-original { color: #9298a3; text-decoration-line: line-through; text-decoration-color: #ef4444; text-decoration-thickness: 1px; }
    .review-original h1, .review-original h2, .review-original h3, .review-original h4, .review-original h5, .review-original h6 { color: inherit; }
    .review-proposed { color: var(--ui-primary-strong); }
    .review-proposed h1, .review-proposed h2, .review-proposed h3, .review-proposed h4, .review-proposed h5, .review-proposed h6 { color: inherit; }
    .review-notice { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 18px 0; padding: 10px 12px; border-radius: 8px; background: #fff7ed; color: #9a3412; font-size: 14px; }
    .review-notice button { padding: 5px 9px; border-color: #fdba74; color: #9a3412; }
    .empty-state { color: var(--ui-text-muted); text-align: center; padding: 48px 16px; }
    article h1, article h2, article h3 { line-height: 1.3; color: var(--ui-text); }
    article h1, article h2, article h3, article h4, article h5, article h6 { scroll-margin-top: 88px; }
    article p, article h1, article h2, article h3, article h4, article h5, article h6,
    article li, article th, article td { white-space: pre-wrap; }
    article h1 { margin: 0 0 18px; font-size: 2em; }
    article h2 { margin: 28px 0 12px; font-size: 1.5em; }
    article h3 { margin: 20px 0 8px; font-size: 1.25em; }
    article pre { padding: 14px; border-radius: 7px; background: #111827; color: #e5e7eb; overflow-x: auto; }
    article pre.canvas-code { padding-top: 46px; }
    article pre.canvas-code-wrap { white-space: pre-wrap; overflow-wrap: anywhere; overflow-x: hidden; }
    article code { padding: 2px 4px; border-radius: 4px; background: #eef2ff; }
    article pre code { padding: 0; background: transparent; }
    article blockquote { margin-left: 0; padding-left: 15px; border-left: 3px solid var(--ui-border-strong); color: var(--ui-text-muted); }
    .task-list { padding-left: 0; list-style: none; }
    .task-list > .task-item { margin-left: 0; }
    .task-list > .task-item.task-item-completed { color: #8e8e8e; text-decoration-line: line-through; text-decoration-color: #8e8e8e; text-decoration-thickness: 1px; }
    .task-list > .task-item.task-item-completed a, .task-list > .task-item.task-item-completed code { color: inherit; }
    .task-checkbox { display: inline-block; width: 1em; height: 1em; margin: 0 .45em 0 0; font-size: inherit; vertical-align: -0.125em; accent-color: var(--ui-primary); cursor: pointer; }
    article table { width: 100%; margin: 16px 0; border-collapse: collapse; font-size: .95em; }
    article th, article td { padding: 8px 10px; border: 1px solid var(--ui-border); text-align: left; vertical-align: top; }
    article th { background: var(--ui-surface-subtle); color: var(--ui-text); font-weight: 600; }
    [hidden] { display: none !important; }
    @media (min-width: 1180px) {
      main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 210mm) minmax(0, 1fr); gap: 16px; max-width: none; padding-inline: 20px; }
      .outline-sidebar { grid-column: 1; grid-row: 1; position: sticky; top: 82px; left: auto; width: min(240px, 100%); padding-top: 28px; align-self: start; justify-self: start; }
      .outline-panel { top: 72px; max-height: calc(100vh - 130px); }
      .workspace { grid-column: 2; grid-row: 1; }
    }
    @media (min-width: 721px) and (max-width: 1179px) {
      main { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 16px; max-width: 1200px; }
      main.outline-open { grid-template-columns: 280px minmax(0, 1fr); }
      .outline-sidebar { grid-column: 1; grid-row: 1; position: sticky; top: 82px; width: 100%; padding-top: 28px; align-self: start; }
      main.outline-open .outline-sidebar { width: 100%; padding: 28px 0 0; overflow: visible; background: transparent; box-shadow: none; }
      .outline-panel { top: 72px; max-height: calc(100vh - 130px); }
      main.outline-open .outline-panel { padding: 10px 8px 10px 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; overscroll-behavior: contain; }
      .workspace { grid-column: 2; grid-row: 1; }
    }
    @media (max-width: 720px) {
      header { padding: 12px 14px; }
      #status { max-width: 45vw; }
      main { display: block; padding: 10px; }
      .outline-sidebar { position: fixed; top: 61px; right: 0; bottom: 0; left: auto; width: min(280px, 85vw); max-height: none; padding: 30px 10px 10px; overflow: visible; z-index: 3; background: var(--ui-surface); box-shadow: -4px 0 16px rgba(15, 23, 42, .06); transform: translateX(0); }
      main:not(.outline-open) .outline-sidebar { transform: translateX(calc(100% - 44px)); padding: 30px 0 10px; background: transparent; box-shadow: none; }
      main:not(.outline-open) .outline-sidebar .outline-toggle { border-radius: 8px 0 0 8px; background: var(--ui-surface); }
      main:not(.outline-open) .outline-sidebar .outline-toggle { width: 44px; height: 44px; padding: 11px 13px; }
      main:not(.outline-open) .outline-toggle .outline-collapsed-icon { display: none; }
      main:not(.outline-open) .outline-toggle .outline-mobile-icon { display: block; width: 18px; height: 18px; }
      .outline-sidebar::after { content: ''; position: absolute; top: 0; left: -64px; right: auto; bottom: 0; width: 64px; background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, .45) 28%, rgba(255, 255, 255, .82) 58%, rgba(255, 255, 255, .98) 82%, rgba(255, 255, 255, .98) 100%); opacity: 0; pointer-events: none; transition: opacity var(--outline-motion-duration) var(--outline-motion-ease); }
      main.outline-open .outline-sidebar::after { opacity: 1; }
      .outline-panel { top: 74px; max-height: calc(100vh - 130px); padding: 10px 0; transition: opacity var(--outline-motion-duration) var(--outline-motion-ease), visibility 0s linear var(--outline-motion-duration); }
      main:not(.outline-open) .outline-panel { clip-path: inset(0); }
      .selection-toolbar { max-width: calc(100vw - 12px); }
      .workspace { grid-column: auto; grid-row: auto; min-height: calc(100vh - 100px); border-radius: 8px; }
      article { min-height: calc(100vh - 132px); padding: 20px 18px; }
      article table { display: block; overflow-x: auto; white-space: nowrap; }
    }
    @media (max-width: 420px) {
      header { padding: 10px; }
      .outline-sidebar { top: 57px; }
      .toolbar { gap: 6px; }
      #reload-latest { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      main, .outline-sidebar, .outline-panel { transition-duration: .01ms; transition-delay: 0s; }
    }
  </style>

  <header>

  <div id="selection-toolbar" class="selection-toolbar" role="toolbar" aria-label="文本格式" hidden>
    <span class="selection-format-handle" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8.5 7C9.32843 7 10 6.32843 10 5.5C10 4.67157 9.32843 4 8.5 4C7.67157 4 7 4.67157 7 5.5C7 6.32843 7.67157 7 8.5 7ZM8.5 13.5C9.32843 13.5 10 12.8284 10 12C10 11.1716 9.32843 10.5 8.5 10.5C7.67157 10.5 7 11.1716 7 12C7 12.8284 7.67157 13.5 8.5 13.5ZM10 18.5C10 19.3284 9.32843 20 8.5 20C7.67157 20 7 19.3284 7 18.5C7 17.6716 7.67157 17 8.5 17C9.32843 17 10 17.6716 10 18.5ZM15.5 7C16.3284 7 17 6.32843 17 5.5C17 4.67157 16.3284 4 15.5 4C14.6716 4 14 4.67157 14 5.5C14 6.32843 14.6716 7 15.5 7ZM17 12C17 12.8284 16.3284 13.5 15.5 13.5C14.6716 13.5 14 12.8284 14 12C14 11.1716 14.6716 10.5 15.5 10.5C15.5 10.5 17 11.1716 17 12ZM15.5 20C16.3284 20 17 19.3284 17 18.5C17 17.6716 16.3284 17 15.5 17C14.6716 17 14 17.6716 14 18.5C14 19.3284 14.6716 20 15.5 20Z"></path></svg></span>

    <button id="selection-code" class="selection-format-button" type="button" aria-label="代码块" title="切换代码块" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M24 12L18.3431 17.6569L16.9289 16.2426L21.1716 12L16.9289 7.75736L18.3431 6.34315L24 12ZM2.82843 12L7.07107 16.2426L5.65685 17.6569L0 12L5.65685 6.34315L7.07107 7.75736L2.82843 12ZM9.78845 21H7.66009L14.2116 3H16.3399L9.78845 21Z"></path></svg></button>

      <button id="selection-format-menu-toggle" class="selection-format-menu-toggle" type="button" aria-label="文本和列表格式" title="文本和列表格式" aria-expanded="false" aria-controls="selection-format-menu"><span id="selection-format-menu-label">文本</span><svg class="selection-format-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>

        <button type="button" role="menuitem" data-format="P" aria-current="true">文本</button>

        <button type="button" role="menuitem" data-format="H2" aria-current="false">标题 2</button>
        <button type="button" role="menuitem" data-format="H3" aria-current="false">标题 3</button>
        <button type="button" role="menuitem" data-format="UL" aria-current="false">无序列表</button>
        <button type="button" role="menuitem" data-format="OL" aria-current="false">有序列表</button>
        <button type="button" role="menuitem" data-format="TASK" aria-current="false">核对清单</button>
