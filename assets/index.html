  <script>
    const header = document.querySelector('header');
    document.title = header.querySelector('h1').textContent.trim();
    const canvasLayout = document.querySelector('#canvas-layout');
    const preview = document.querySelector('#preview');
    const status = document.querySelector('#status');
    const reloadButton = document.querySelector('#reload-latest');
    const undoButton = document.querySelector('#undo-button');
    const redoButton = document.querySelector('#redo-button');
    const copyButton = document.querySelector('#copy-button');
    const moreToggleButton = document.querySelector('#more-toggle');
    const moreOptions = document.querySelector('#more-options');
    const exportPdfButton = document.querySelector('#export-pdf');
    const exportMarkdownButton = document.querySelector('#export-markdown');
    const importMarkdownButton = document.querySelector('#import-markdown');
    const importMarkdownFileInput = document.querySelector('#import-markdown-file');
    const importTeslaExampleButton = document.querySelector('#import-tesla-example');
    const createDocumentButton = document.querySelector('#create-document');
    const documentMenuToggle = document.querySelector('#document-menu-toggle');
    const documentMenuOptions = document.querySelector('#document-menu-options');
    const archiveMenuToggle = document.querySelector('#archive-menu-toggle');
    const archiveMenuOptions = document.querySelector('#archive-menu-options');
    const outlineToggle = document.querySelector('#outline-toggle');
    const outlinePanel = document.querySelector('#outline-panel');
    const outlineList = document.querySelector('#outline-list');
    const outlineCollapsedIcon = outlineToggle.querySelector('.outline-collapsed-icon');
    const outlineExpandedIcon = outlineToggle.querySelector('.outline-expanded-icon');
    const selectionToolbar = document.querySelector('#selection-toolbar');
    const selectionBoldButton = document.querySelector('#selection-bold');
    const selectionItalicButton = document.querySelector('#selection-italic');
    const selectionQuoteButton = document.querySelector('#selection-quote');
    const selectionCodeButton = document.querySelector('#selection-code');
    const selectionFormatMenuToggle = document.querySelector('#selection-format-menu-toggle');
    const selectionFormatMenuLabel = document.querySelector('#selection-format-menu-label');
    const selectionFormatMenu = document.querySelector('#selection-format-menu');
    const app = { documentId: null, documents: [], archivedDocuments: [], revision: null, content: '', blocks: [], editing: null, review: null, reviewBusy: false, saveTimer: null, undoStack: [], redoStack: [], histories: {}, historyBusy: false, stateRequestId: 0 };
    let outlineEntries = [];
    let outlineScrollFrame = 0;
    let outlineScrollEndTimer = 0;
    let outlineClickScrolling = false;
    let selectionState = null;
    const setStatus = (text) => { status.textContent = text; };

    function setOutlineOpen(open) {
      canvasLayout.classList.toggle('outline-open', open);
      outlinePanel.setAttribute('aria-hidden', String(!open));
      outlineCollapsedIcon.toggleAttribute('hidden', open);
      outlineExpandedIcon.toggleAttribute('hidden', !open);
      outlineToggle.setAttribute('aria-expanded', String(open));
      outlineToggle.title = open ? '收起大纲' : '展开大纲';
      outlineToggle.setAttribute('aria-label', outlineToggle.title);
      if (open) scheduleOutlineActive();
    }

    function setOutlineActiveItem(activeItem) {
      outlineEntries.forEach((entry) => {
        const selected = entry.item === activeItem;
        entry.item.classList.toggle('active', selected);
        entry.item.setAttribute('aria-current', String(selected));
      });
    }

    function updateOutlineActive() {
      if (!outlineEntries.length) return;
      let active = outlineEntries[0];
      outlineEntries.forEach((entry) => {
        if (entry.heading.getBoundingClientRect().top <= 96) active = entry;
      });
      setOutlineActiveItem(active.item);
    }

    function scheduleOutlineActive() {
      if (outlineClickScrolling) return;
      if (outlineScrollFrame) return;
      outlineScrollFrame = window.requestAnimationFrame(() => {
        outlineScrollFrame = 0;
        updateOutlineActive();
      });
    }

    function finishOutlineClickScroll() {
      outlineClickScrolling = false;
      outlineScrollEndTimer = 0;
      scheduleOutlineActive();
    }

    function armOutlineScrollEnd() {
      window.clearTimeout(outlineScrollEndTimer);
      outlineScrollEndTimer = window.setTimeout(finishOutlineClickScroll, 120);
    }

    function handleCanvasScroll() {
      if (outlineClickScrolling) {
        armOutlineScrollEnd();
        return;
      }
      scheduleOutlineActive();
    }

    function renderOutline() {
      outlineEntries = [];
      outlineList.replaceChildren();
      const headings = Array.from(preview.querySelectorAll('h1, h2, h3, h4, h5, h6'))
        .filter((heading) => !heading.closest('.review-proposed'))
        .filter((heading) => heading.textContent.trim());
      headings.forEach((heading) => {
        const level = Number(heading.tagName.slice(1));
        const title = heading.textContent.trim();
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'outline-item';
        item.dataset.level = String(level);
        item.style.paddingInlineStart = `${8 + (level - 1) * 14}px`;
        item.textContent = title;
        item.title = title;
        item.setAttribute('aria-label', title);
        item.setAttribute('aria-current', 'false');
        item.addEventListener('click', () => {
          if (outlineScrollFrame) {
            window.cancelAnimationFrame(outlineScrollFrame);
            outlineScrollFrame = 0;
          }
          setOutlineActiveItem(item);
          outlineClickScrolling = true;
          armOutlineScrollEnd();
          heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
          if (window.matchMedia('(max-width: 720px)').matches) setOutlineOpen(false);
        });
        outlineList.appendChild(item);
        outlineEntries.push({ heading, item });
      });
      if (!outlineEntries.length) {
        const empty = document.createElement('div');
        empty.className = 'outline-empty';
        empty.textContent = '暂无可用大纲';
        outlineList.appendChild(empty);
      }
      scheduleOutlineActive();
    }

    function rememberHistory() {
      if (app.documentId) app.histories[app.documentId] = { undoStack: app.undoStack, redoStack: app.redoStack };
    }

    function restoreHistory(documentId) {
      const history = app.histories[documentId] || { undoStack: [], redoStack: [] };
      app.undoStack = history.undoStack;
      app.redoStack = history.redoStack;
    }

    function applyDocumentListing(listing) {
      app.documents = listing.documents || [];
      app.archivedDocuments = listing.archived_documents || [];
      renderDocumentMenu();
      renderArchiveMenu();
    }

    function updateDocumentEntry(next) {
      const entry = app.documents.find((document) => document.id === next.document_id);
      if (entry) {
        entry.title = next.title || entry.title;
        entry.revision = next.revision;
        entry.has_review = Boolean(next.review);
      }
    }

    function clearDocumentState() {
      app.documentId = null;
      app.content = '';
      app.revision = null;
      app.blocks = [];
      app.editing = null;
      app.review = null;
      app.undoStack = [];
      app.redoStack = [];
      renderBlocks();
      updateHistoryButtons();
    }

    function menuDisplayTitle(title) {
      const chars = Array.from(title);
      return chars.length > 15 ? chars.slice(0, 15).join('') + '…' : title;
    }

    function renderDocumentMenu() {
      documentMenuOptions.replaceChildren();
      app.documents.forEach((doc) => {
        const title = doc.title || '未命名文档';
        const option = document.createElement('div');
        option.className = 'document-menu-option' + (doc.id === app.documentId ? ' selected' : '');
        option.setAttribute('role', 'none');
        const select = document.createElement('button');
        select.className = 'document-menu-select';
        select.type = 'button';
        select.role = 'menuitem';
        select.setAttribute('aria-current', String(doc.id === app.documentId));
        select.title = title;
        select.setAttribute('aria-label', title);
        const label = document.createElement('span');
        label.className = 'document-menu-label';
        label.textContent = menuDisplayTitle(title);
        select.appendChild(label);
        if (doc.has_review) {
          const dot = document.createElement('span');
          dot.className = 'document-menu-review';
          dot.title = '有待确认修改';
          select.appendChild(dot);
        }
        select.addEventListener('click', () => {
          closeDocumentMenu();
          void switchDocument(doc.id);
        });
        option.appendChild(select);
        const remove = document.createElement('button');
        remove.className = 'document-menu-delete document-menu-archive';
        remove.type = 'button';
        remove.role = 'menuitem';
        remove.title = '归档';
        remove.setAttribute('aria-label', '归档');
        remove.innerHTML = '<svg class="mode-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10H2V4.00293C2 3.44903 2.45531 3 2.9918 3H21.0082C21.556 3 22 3.43788 22 4.00293V10H21V20.0015C21 20.553 20.5551 21 20.0066 21H3.9934C3.44476 21 3 20.5525 3 20.0015V10ZM19 10H5V19H19V10ZM4 5V8H20V5H4ZM9 12H15V14H9V12Z"></path></svg>';
        remove.addEventListener('click', (event) => {
          event.stopPropagation();
          void archiveDocument(doc.id, title);
        });
        option.appendChild(remove);
        documentMenuOptions.appendChild(option);
      });
    }

    function renderArchiveMenu() {
      archiveMenuOptions.replaceChildren();
      if (!app.archivedDocuments.length) {
        const empty = document.createElement('div');
        empty.className = 'archive-menu-empty';
        empty.textContent = '暂无归档文档';
        archiveMenuOptions.appendChild(empty);
        return;
      }
      app.archivedDocuments.forEach((doc) => {
        const title = doc.title || '未命名文档';
        const option = document.createElement('div');
        option.className = 'document-menu-option document-menu-archived';
        option.setAttribute('role', 'none');
        const label = document.createElement('div');
        label.className = 'document-menu-select';
        label.title = title;
        label.setAttribute('aria-label', `${title}，已归档`);
        const text = document.createElement('span');
        text.className = 'document-menu-label';
        text.textContent = menuDisplayTitle(title);
        label.appendChild(text);
        option.appendChild(label);
        const actions = document.createElement('div');
        actions.className = 'document-menu-archive-actions';
        const restore = document.createElement('button');
        restore.className = 'document-menu-restore';
        restore.type = 'button';
        restore.role = 'menuitem';
        restore.title = '恢复';
        restore.setAttribute('aria-label', '恢复');
        restore.innerHTML = '<svg class="mode-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5.82843 6.99955L8.36396 9.53509L6.94975 10.9493L2 5.99955L6.94975 1.0498L8.36396 2.46402L5.82843 4.99955H13C17.4183 4.99955 21 8.58127 21 12.9996C21 17.4178 17.4183 20.9996 13 20.9996H4V18.9996H13C16.3137 18.9996 19 16.3133 19 12.9996C19 9.68584 16.3133 6.99955 13 6.99955H5.82843Z"></path></svg>';
        restore.addEventListener('click', (event) => {
          event.stopPropagation();
          void restoreDocument(doc.id);
        });
        actions.appendChild(restore);
        const permanentlyDelete = document.createElement('button');
        permanentlyDelete.className = 'document-menu-delete';
        permanentlyDelete.type = 'button';
        permanentlyDelete.role = 'menuitem';
        permanentlyDelete.title = '永久删除';
        permanentlyDelete.setAttribute('aria-label', '永久删除');
        permanentlyDelete.textContent = '×';
        permanentlyDelete.addEventListener('click', (event) => {
          event.stopPropagation();
          void permanentlyDeleteDocument(doc.id, title);
        });
        actions.appendChild(permanentlyDelete);
        option.appendChild(actions);
        archiveMenuOptions.appendChild(option);
      });
    }

    function updateHistoryButtons() {
      const blocked = app.historyBusy || app.reviewBusy || app.review;
      const hasDocument = Boolean(app.documentId);
      undoButton.disabled = blocked || !app.undoStack.length;
      redoButton.disabled = blocked || !app.redoStack.length;
      moreToggleButton.disabled = blocked;
      exportPdfButton.disabled = blocked || !hasDocument;
      exportMarkdownButton.disabled = blocked || !hasDocument;
      importMarkdownButton.disabled = blocked;
      importTeslaExampleButton.disabled = blocked;
      createDocumentButton.disabled = blocked;
      copyButton.disabled = !hasDocument;
      if (blocked) closeMoreMenu();
    }

    function recordEdit(previousContent, nextContent) {
      if (previousContent === nextContent) return;
      app.undoStack.push(previousContent);
      app.redoStack = [];
      updateHistoryButtons();
    }

    async function request(path, options = {}) {
      const response = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || `请求失败（${response.status}）`);
      return payload;
    }

    function statePath() {
      return app.documentId ? `/api/state?document_id=${encodeURIComponent(app.documentId)}` : '/api/state';
    }

    function documentPayload(payload = {}) {
      return app.documentId ? { ...payload, document_id: app.documentId } : payload;
    }

    async function switchDocument(documentId, persist = true) {
      if (!documentId || documentId === app.documentId || app.historyBusy || app.reviewBusy) return;
      if (!(await save())) return;
      rememberHistory();
      app.documentId = documentId;
      restoreHistory(documentId);
      app.editing = null;
      app.revision = null;
      app.content = '';
      app.blocks = [];
      app.review = null;
      renderDocumentMenu();
      try {
        if (persist) await request('/api/documents/active', { method: 'POST', body: JSON.stringify({ document_id: documentId }) });
        applyState(await request(statePath()));
        setStatus('');
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function archiveDocument(documentId, title) {
      if (!documentId || app.historyBusy || app.reviewBusy) return;
      if (!(await save())) return;
      closeDocumentMenu();
      closeArchiveMenu();
      try {
        const listing = await request('/api/documents/delete', {
          method: 'POST',
          body: JSON.stringify({ document_id: documentId })
        });
        applyDocumentListing(listing);
        if (listing.active_id && listing.active_id !== app.documentId) {
          await switchDocument(listing.active_id, false);
        } else if (!listing.active_id) {
          clearDocumentState();
          setStatus('');
        } else {
          setStatus('');
        }
        delete app.histories[documentId];
        setStatus('已归档文档');
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function restoreDocument(documentId) {
      if (!documentId || app.historyBusy || app.reviewBusy) return;
      if (!(await save())) return;
      closeDocumentMenu();
      closeArchiveMenu();
      try {
        const listing = await request('/api/documents/restore', {
          method: 'POST',
          body: JSON.stringify({ document_id: documentId })
        });
        applyDocumentListing(listing);
        if (!app.documentId && listing.active_id) await switchDocument(listing.active_id, false);
        setStatus('已恢复文档');
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function permanentlyDeleteDocument(documentId, title) {
      if (!documentId || app.historyBusy || app.reviewBusy) return;
      if (!window.confirm(`确认永久删除“${title}”吗？此操作不可恢复。`)) return;
      if (!(await save())) return;
      closeDocumentMenu();
      closeArchiveMenu();
      try {
        const listing = await request('/api/documents/permanent-delete', {
          method: 'POST',
          body: JSON.stringify({ document_id: documentId })
        });
        applyDocumentListing(listing);
        delete app.histories[documentId];
        setStatus('');
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function createDocument(content = '# 未命名文档\n\n') {
      if (app.historyBusy || app.reviewBusy) return;
      if (!(await save())) return;
      closeDocumentMenu();
      closeMoreMenu();
      try {
        const next = await request('/api/documents', {
          method: 'POST',
          body: JSON.stringify({ content })
        });
        app.documents.push({
          id: next.document_id,
          title: next.title,
          revision: next.revision,
          has_review: Boolean(next.review)
        });
        applyState(next);
        setStatus('');
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function syncCanvas() {
      try {
        const listing = await request('/api/documents');
        applyDocumentListing(listing);
        if (!listing.active_id && !app.documents.length) {
          if (app.documentId) clearDocumentState();
          else {
            renderBlocks();
            updateHistoryButtons();
          }
          setStatus('');
          return;
        }
        const available = app.documents.some((document) => document.id === app.documentId);
        const externalActive = listing.active_id && listing.active_id !== app.documentId && !app.editing && !app.reviewBusy;
        const target = externalActive || !available ? listing.active_id : app.documentId;
        if (target && target !== app.documentId && !app.editing && !app.reviewBusy) {
          await switchDocument(target, false);
        } else if (app.documentId) {
          await loadState();
        }
      } catch (error) {
        setStatus(error.message);
      }
    }

    function renderReview(container, review) {
      const change = document.createElement('div');
      change.className = 'review-change';
      const actions = document.createElement('div');
      actions.className = 'review-actions';
      const reject = document.createElement('button');
      reject.id = 'review-reject';
      reject.type = 'button';
      reject.textContent = '撤销';
      reject.addEventListener('click', () => void resolveReview('reject'));
      const accept = document.createElement('button');
      accept.id = 'review-accept';
      accept.type = 'button';
      accept.className = 'accept';
      accept.textContent = '接受';
      accept.addEventListener('click', () => void resolveReview('accept'));
      actions.append(reject, accept);
      const original = document.createElement('div');
      original.className = 'review-original';
      original.setAttribute('aria-label', '修改前内容');
      original.innerHTML = review.old_html || '';
      const proposed = document.createElement('div');
      proposed.className = 'review-proposed';
      proposed.setAttribute('aria-label', '修改后内容');
      proposed.innerHTML = review.new_html || '';
      change.append(actions, original, proposed);
      container.setAttribute('aria-label', '待确认修改');
      container.appendChild(change);
    }

    function renderReviewNotice() {
      const notice = document.createElement('div');
      notice.className = 'review-notice';
      notice.textContent = app.review?.stale
        ? '修改建议已过期，请撤销后重新生成。'
        : '修改建议暂时无法定位，请撤销后重新生成。';
      const reject = document.createElement('button');
      reject.id = 'review-reject';
      reject.type = 'button';
      reject.textContent = '撤销建议';
      reject.addEventListener('click', () => void resolveReview('reject'));
      notice.appendChild(reject);
      preview.appendChild(notice);
    }

    function hasEmptyBodySlot() {
      const first = app.blocks[0];
      return app.blocks.length === 1 && Boolean(first?.content && /^\s*#\s+/.test(first.content))
        && app.content.endsWith('\n\n');
    }

    function decorateCodeBlocks(container, sourceContent = '') {
      if (/^(?: {4}|\t)/.test(sourceContent)) container.dataset.codeStyle = 'indented';
      container.querySelectorAll('pre').forEach((pre) => {
        if (pre.classList.contains('canvas-code')) return;
        const host = pre.parentElement;
        if (!host) return;
        pre.classList.add('canvas-code');
        host.classList.add('canvas-code-host');
        const actions = document.createElement('div');
        actions.className = 'canvas-code-actions';
        actions.dataset.canvasUi = 'true';
        actions.contentEditable = 'false';
        actions.setAttribute('role', 'toolbar');
        actions.innerHTML = '<button type="button" contenteditable="false" data-code-action="wrap" aria-label="切换代码换行" title="切换代码换行" aria-pressed="false">换行</button><button type="button" contenteditable="false" data-code-action="copy" aria-label="复制代码" title="复制代码">复制</button>';
        pre.before(actions);
      });
    }

    function renderBlocks() {
      hideSelectionToolbar();
      preview.innerHTML = '';
      if (!app.documentId) {
        const empty = document.createElement('div');
        empty.className = 'document-empty-state';
        empty.innerHTML = '<svg class="document-empty-state-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.02381 3.78307C4.12549 3.32553 4.5313 3 5 3H19C19.4687 3 19.8745 3.32553 19.9762 3.78307L21.9762 12.7831C21.992 12.8543 22 12.927 22 13V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V13C2 12.927 2.00799 12.8543 2.02381 12.7831L4.02381 3.78307ZM5.80217 5L4.24662 12H9C9 13.6569 10.3431 15 12 15C13.6569 15 15 13.6569 15 12H19.7534L18.1978 5H5.80217ZM16.584 14C15.8124 15.7659 14.0503 17 12 17C9.94968 17 8.1876 15.7659 7.41604 14H4V19H20V14H16.584Z"></path></svg><div>暂无文档，请从文档菜单中新建文档</div>';
        preview.appendChild(empty);
        renderOutline();
        return;
      }
      if (!app.blocks.length) {
        const empty = document.createElement('div');
        empty.className = 'canvas-block empty-state';
        empty.dataset.blockIndex = '0';
        empty.tabIndex = 0;
        empty.setAttribute('aria-label', '点击编辑此段内容');
        const paragraph = document.createElement('p');
        paragraph.textContent = '点击此处输入文档内容';
        empty.appendChild(paragraph);
        preview.appendChild(empty);
        renderOutline();
        return;
      }
      if (app.review && (app.review.stale || app.review.unsupported || app.review.block_index == null)) {
        renderReviewNotice();
      }
      app.blocks.forEach((block, index) => {
        const container = document.createElement('div');
        container.className = 'canvas-block';
        container.dataset.blockIndex = String(index);
        container.tabIndex = 0;
        container.setAttribute('aria-label', '点击编辑此段内容');
        if (app.review && app.review.block_index === index && !app.review.stale && !app.review.unsupported) {
          renderReview(container, app.review);
        } else {
          container.innerHTML = block.html.trim();
        }
        decorateCodeBlocks(container, block.content);
        preview.appendChild(container);
      });
      if (hasEmptyBodySlot()) {
        const container = document.createElement('div');
        container.className = 'canvas-block body-placeholder';
        container.dataset.blockIndex = '1';
        container.tabIndex = 0;
        container.setAttribute('aria-label', '点击编辑正文');
        container.appendChild(document.createElement('p'));
        preview.appendChild(container);
      }
      renderOutline();
    }

    function applyState(next) {
      const editing = app.editing;
      const documentChanged = app.documentId !== next.document_id;
      const stateChanged = app.revision !== next.revision;
      const reviewChanged = JSON.stringify(app.review) !== JSON.stringify(next.review || null);
      if (documentChanged) {
        rememberHistory();
        app.documentId = next.document_id;
        restoreHistory(next.document_id);
      } else if (app.revision && app.revision !== next.revision && !editing) {
        app.undoStack = [];
        app.redoStack = [];
      }
      app.content = next.content;
      app.revision = next.revision;
      app.blocks = next.blocks || [];
      app.review = next.review || null;
      updateDocumentEntry(next);
      renderDocumentMenu();
      reloadButton.style.display = 'none';
      if (!editing && (stateChanged || reviewChanged)) renderBlocks();
      updateHistoryButtons();
    }

    async function loadState(force = false) {
      const stateRequestId = ++app.stateRequestId;
      try {
        const next = await request(statePath());
        if (stateRequestId !== app.stateRequestId) return;
        if (!force && app.revision && next.revision !== app.revision && app.editing) {
          reloadButton.style.display = 'inline-block';
          setStatus('画布已有外部更新；当前块编辑已保留');
          return;
        }
        if (force && app.editing) cancelBlockEdit();
        applyState(next);
        setStatus('');
      } catch (error) {
        setStatus(error.message);
      }
    }

    function activeContainer() {
      return preview.querySelector('.canvas-block.editing');
    }

    function inlineMarkdown(node) {
      if (node.nodeType === Node.TEXT_NODE) return node.nodeValue.replace(/\u00a0/g, ' ').replace(/\r\n?/g, '\n');
      if (node.nodeType !== Node.ELEMENT_NODE) return '';
      const tag = node.tagName.toLowerCase();
      if (tag === 'br') return '\n';
      if (tag === 'input' && node.getAttribute('type') === 'checkbox') return node.checked ? '[x] ' : '[ ] ';
      const content = Array.from(node.childNodes).map(inlineMarkdown).join('');
      if (tag === 'strong' || tag === 'b') return `**${content}**`;
      if (tag === 'em' || tag === 'i') return `*${content}*`;
      if (tag === 'del' || tag === 's') return `~~${content}~~`;
      if (tag === 'code') return '`' + content.replace(/`/g, '\\`') + '`';
      if (tag === 'a') {
        const href = node.getAttribute('href') || '';
        return href ? `[${content}](${href})` : content;
      }
      return content;
    }

    function blockMarkdown(node) {
      if (node.nodeType === Node.TEXT_NODE) return node.nodeValue;
      if (node.nodeType !== Node.ELEMENT_NODE) return '';
      if (node.hasAttribute('data-canvas-ui')) return '';
      const tag = node.tagName.toLowerCase();
      if (/^h[1-6]$/.test(tag)) return `${'#'.repeat(Number(tag[1]))} ${inlineMarkdown(node)}`;
      if (tag === 'p') return inlineMarkdown(node);
      if (tag === 'ul' || tag === 'ol') {
        const marker = tag === 'ol' ? (index) => `${index + 1}. ` : () => '- ';
        return Array.from(node.children)
          .filter((child) => child.tagName.toLowerCase() === 'li')
          .map((child, index) => `${marker(index)}${inlineMarkdown(child)}`)
          .join('\n');
      }
      if (tag === 'table') {
        const rows = Array.from(node.querySelectorAll('tr')).map((row) =>
          Array.from(row.children).map((cell) => inlineMarkdown(cell).trim().replace(/\|/g, '\\|').replace(/\n/g, ' '))
        );
        if (!rows.length) return '';
        const headerCells = Array.from(node.querySelectorAll('thead th'));
        const separator = rows[0].map((_, index) => {
          const alignment = headerCells[index]?.style.textAlign;
          return alignment === 'right' ? '---:' : alignment === 'center' ? ':---:' : '---';
        });
        return [rows[0], separator, ...rows.slice(1)]
          .map((row) => `| ${row.join(' | ')} |`)
          .join('\n');
      }
      if (tag === 'blockquote') {
        const content = Array.from(node.childNodes).map(blockMarkdown).filter(Boolean).join('\n\n');
        return content.split('\n').map((line) => line ? `> ${line}` : '>').join('\n');
      }
      if (tag === 'pre') {
        const content = node.textContent.replace(/\n+$/, '');
        if (node.closest('[data-code-style="indented"]')) {
          return content.split('\n').map((line) => '    ' + line).join('\n');
        }
        return '```\n' + content + '\n```';
      }
      if (tag === 'hr') return '---';
      if (tag === 'div') return Array.from(node.childNodes).map(blockMarkdown).filter(Boolean).join('\n\n');
      return inlineMarkdown(node).trim();
    }

    function blockHtmlForMatching(container) {
      const copy = container.cloneNode(true);
      copy.querySelectorAll('[data-canvas-ui]').forEach((node) => node.remove());
      copy.querySelectorAll('.canvas-code-host').forEach((node) => node.classList.remove('canvas-code-host'));
      copy.querySelectorAll('pre.canvas-code, pre.canvas-code-wrap').forEach((node) => {
        node.classList.remove('canvas-code', 'canvas-code-wrap');
      });
      return copy.innerHTML.trim();
    }

    function serializeBlockContent(container) {
      const parts = Array.from(container.childNodes)
        .map(blockMarkdown)
        .filter((part) => part.trim());
      if (!parts.length) return '';
      const content = parts.join('\n\n');
      return content.endsWith('\n') ? content : `${content}\n`;
    }

    function insertEditorBreak(container, paragraphBreak) {
      const selection = window.getSelection();
      if (!selection?.rangeCount) return false;
      const range = selection.getRangeAt(0);
      if (!container.contains(range.commonAncestorContainer)) return false;
      range.deleteContents();
      const breaks = [document.createElement('br')];
      if (paragraphBreak) breaks.push(document.createElement('br'));
      const fragment = document.createDocumentFragment();
      breaks.forEach((lineBreak) => fragment.appendChild(lineBreak));
      range.insertNode(fragment);
      const caret = document.createRange();
      caret.setStartAfter(breaks[breaks.length - 1]);
      caret.collapse(true);
      selection.removeAllRanges();
      selection.addRange(caret);
      container.dispatchEvent(new Event('input', { bubbles: true }));
      return true;
    }

    function placeCaretInEmptyParagraph(container) {
      const paragraph = container.firstElementChild;
      if (container.childNodes.length !== 1 || paragraph?.tagName !== 'P' || paragraph.textContent) return false;
      const range = document.createRange();
      range.selectNodeContents(paragraph);
      range.collapse(true);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      return true;
    }

    function placeCaretAtPoint(container, event) {
      let range = null;
      if (event?.type === 'click' && document.caretRangeFromPoint) {
        range = document.caretRangeFromPoint(event.clientX, event.clientY);
      } else if (event?.type === 'click' && document.caretPositionFromPoint) {
        const position = document.caretPositionFromPoint(event.clientX, event.clientY);
        if (position) {
          range = document.createRange();
          range.setStart(position.offsetNode, position.offset);
          range.collapse(true);
        }
      }
      if (!range || !container.contains(range.startContainer)) {
        range = document.createRange();
        range.selectNodeContents(container);
        range.collapse(false);
      }
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      if (app.editing) app.editing.mergeBoundary = null;
    }

    function selectionRangeWithin(container) {
      const selection = window.getSelection();
      if (!selection?.rangeCount || selection.isCollapsed
        || !container.contains(selection.anchorNode)
        || !container.contains(selection.focusNode)) return null;
      return selection.getRangeAt(0).cloneRange();
    }

    function selectableContentBlock(container) {
      return container.matches('.canvas-block') && !container.hidden
        && !container.closest('[hidden]') && container.getClientRects().length
        && container.textContent.trim();
    }

    function selectionRangeWithinPreview() {
      const selection = window.getSelection();
      if (!selection?.rangeCount || selection.isCollapsed
        || !preview.contains(selection.anchorNode) || !preview.contains(selection.focusNode)) return null;
      const range = selection.getRangeAt(0).cloneRange();
      if (!range.toString().trim()) return null;
      const containers = Array.from(preview.querySelectorAll('.canvas-block'))
        .filter(selectableContentBlock)
        .filter((container) => {
          const contents = document.createRange();
          contents.selectNodeContents(container);
          return range.compareBoundaryPoints(Range.END_TO_START, contents) < 0
            && range.compareBoundaryPoints(Range.START_TO_END, contents) > 0;
        });
      return containers.length > 1 ? { range, containers } : null;
    }

    function closeSelectionFormatMenu() {
      selectionFormatMenu.hidden = true;
      selectionFormatMenu.classList.remove('opens-up');
      selectionFormatMenu.style.maxHeight = '';
      selectionFormatMenuToggle.setAttribute('aria-expanded', 'false');
    }

    function contentBlockElement(container) {
      return Array.from(container.children).find((child) => !child.hasAttribute('data-canvas-ui')) || container.firstElementChild;
    }

    function updateSelectionFormatMenu(context) {
      const source = contentBlockElement(context.container);
      const tag = source?.tagName;
      const value = tag === 'UL' && source.querySelector('input[type="checkbox"]')
        ? 'TASK'
        : ['P', 'H1', 'H2', 'H3', 'UL', 'OL'].includes(tag) ? tag : 'P';
      selectionQuoteButton.setAttribute('aria-pressed', String(tag === 'BLOCKQUOTE'));
      selectionFormatMenu.querySelectorAll('[data-format]').forEach((option) => {
        option.setAttribute('aria-current', String(option.dataset.format === value));
      });
      selectionFormatMenuLabel.textContent = selectionFormatMenu.querySelector('[data-format="' + value + '"]')?.textContent.trim() || '文本';
    }

    function hideSelectionToolbar() {
      selectionState = null;
      selectionToolbar.hidden = true;
      selectionToolbar.style.left = '';
      selectionToolbar.style.top = '';
      selectionBoldButton.setAttribute('aria-pressed', 'false');
      selectionItalicButton.setAttribute('aria-pressed', 'false');
      selectionQuoteButton.setAttribute('aria-pressed', 'false');
      selectionCodeButton.setAttribute('aria-pressed', 'false');
      selectionBoldButton.disabled = false;
      selectionItalicButton.disabled = false;
      selectionQuoteButton.disabled = false;
      selectionCodeButton.disabled = false;
      selectionFormatMenu.querySelectorAll('[data-format]').forEach((option) => { option.disabled = false; });
      closeSelectionFormatMenu();
    }

    function currentSelectionContext() {
      const container = activeContainer();
      const range = container ? selectionRangeWithin(container) : null;
      if (range && range.toString()) return { container, range, containers: [container] };
      const cross = selectionRangeWithinPreview();
      if (!cross || (container && !cross.containers.includes(container))) return null;
      return { container: container || cross.containers[0], ...cross, crossBlock: true };
    }

    function selectionRect(range) {
      const first = selectionState?.containers?.length > 1 ? range.getClientRects()[0] : null;
      if (first) return first;
      const rect = range.getBoundingClientRect();
      if (rect.width || rect.height) return rect;
      return range.getClientRects()[0] || null;
    }

    function positionSelectionFormatMenu() {
      if (selectionFormatMenu.hidden) return;
      selectionFormatMenu.classList.remove('opens-up');
      selectionFormatMenu.style.maxHeight = '';
      const toolbarRect = selectionToolbar.getBoundingClientRect();
      const menuRect = selectionFormatMenu.getBoundingClientRect();
      const spaceBelow = Math.max(0, window.innerHeight - toolbarRect.bottom - 8);
      const spaceAbove = Math.max(0, toolbarRect.top - 8);
      const opensUp = menuRect.height > spaceBelow && spaceAbove > spaceBelow;
      selectionFormatMenu.classList.toggle('opens-up', opensUp);
      const available = opensUp ? spaceAbove : spaceBelow;
      if (menuRect.height > available) selectionFormatMenu.style.maxHeight = `${Math.floor(available)}px`;
    }

    function positionSelectionToolbar() {
      if (!selectionState || selectionToolbar.hidden) return;
      const rect = selectionRect(selectionState.range);
      if (!rect) {
        hideSelectionToolbar();
        return;
      }
      const toolbarRect = selectionToolbar.getBoundingClientRect();
      if (!toolbarRect.width || !toolbarRect.height) return;
      const gap = 8;
      const maxLeft = Math.max(8, window.innerWidth - toolbarRect.width - 8);
      const left = Math.min(maxLeft, Math.max(8, rect.left + (rect.width - toolbarRect.width) / 2));
      const above = rect.top - toolbarRect.height - gap;
      const maxTop = Math.max(8, window.innerHeight - toolbarRect.height - 8);
      const top = above >= 8 ? above : Math.max(8, Math.min(maxTop, rect.bottom + gap));
      selectionToolbar.style.left = `${left}px`;
      selectionToolbar.style.top = `${top}px`;
      positionSelectionFormatMenu();
    }

    function syncSelectionToolbar() {
      const context = currentSelectionContext();
      if (context) {
        selectionState = context;
        selectionToolbar.hidden = false;
        try {
          selectionBoldButton.setAttribute('aria-pressed', String(document.queryCommandState('bold')));
          selectionItalicButton.setAttribute('aria-pressed', String(document.queryCommandState('italic')));
        } catch {
          selectionBoldButton.setAttribute('aria-pressed', 'false');
          selectionItalicButton.setAttribute('aria-pressed', 'false');
        }
        const crossBlock = context.containers.length > 1;
        const source = contentBlockElement(context.container);
        const isCodeBlock = source?.tagName === 'PRE';
        const canToggleCode = !crossBlock && ['P', 'PRE'].includes(source?.tagName);
        selectionBoldButton.disabled = crossBlock;
        selectionItalicButton.disabled = crossBlock;
        selectionQuoteButton.disabled = crossBlock;
        selectionCodeButton.disabled = !canToggleCode;
        selectionCodeButton.setAttribute('aria-pressed', String(isCodeBlock));
        selectionFormatMenu.querySelectorAll('[data-format]').forEach((option) => {
          option.disabled = crossBlock && !['UL', 'OL', 'TASK'].includes(option.dataset.format);
        });
        updateSelectionFormatMenu(context);
        positionSelectionToolbar();
        return;
      }
      if (!selectionToolbar.matches(':focus-within')) hideSelectionToolbar();
    }

    function restoreToolbarSelection(wholeBlock = false) {
      const state = selectionState;
      if (!state?.container?.isConnected || (!state.crossBlock && !app.editing)) return null;
      if (!state.crossBlock) state.container.focus({ preventScroll: true });
      const range = wholeBlock ? document.createRange() : state.range.cloneRange();
      if (wholeBlock && state.containers?.length > 1) {
        const first = state.containers[0];
        const last = state.containers[state.containers.length - 1];
        range.setStart(first, 0);
        range.setEnd(last, last.childNodes.length);
      } else if (wholeBlock) {
        range.selectNodeContents(contentBlockElement(state.container) || state.container);
      }
      restoreSelection(range);
      return { ...state, range };
    }

    function applySelectionCommand(command, value = null) {
      const state = restoreToolbarSelection();
      if (!state) return false;
      if (state.containers.length > 1) return false;
      let applied = false;
      try {
        applied = document.execCommand(command, false, value);
      } catch {
        applied = false;
      }
      if (!applied) return false;
      state.container.dispatchEvent(new Event('input', { bubbles: true }));
      syncSelectionToolbar();
      return true;
    }

    function toggleSelectionCodeBlock() {
      const state = restoreToolbarSelection(true);
      if (!state || state.containers.length > 1) return;
      const source = contentBlockElement(state.container);
      if (!source || !['P', 'PRE'].includes(source.tagName)) return;
      const isCodeBlock = source.tagName === 'PRE';
      state.container.querySelectorAll('[data-canvas-ui]').forEach((node) => node.remove());
      state.container.classList.remove('canvas-code-host');
      const target = document.createElement(isCodeBlock ? 'p' : 'pre');
      target.textContent = source.innerText || source.textContent || '';
      state.container.replaceChildren(target);
      if (!isCodeBlock) decorateCodeBlocks(state.container);
      const range = document.createRange();
      range.selectNodeContents(target);
      restoreSelection(range);
      state.container.dispatchEvent(new Event('input', { bubbles: true }));
      syncSelectionToolbar();
    }

    function convertContainerFormat(container, value) {
      const source = contentBlockElement(container) || container;
      const nestedList = source.matches('P, H1, H2, H3') && source.children.length === 1
        && source.firstElementChild?.matches('UL, OL') && source.textContent === source.firstElementChild.textContent
        ? source.firstElementChild
        : source;
      const quoted = source.matches('BLOCKQUOTE');
      const isChecklist = value === 'TASK';
      const target = document.createElement(isChecklist ? 'ul' : value.toLowerCase());
      if (isChecklist) target.className = 'task-list';
      const sourceItems = nestedList.matches('UL, OL')
        ? Array.from(nestedList.children).filter((child) => child.tagName === 'LI')
        : [nestedList];
      const cloneListItem = (item) => {
        const clone = item.cloneNode(true);
        const checkbox = clone.querySelector('input[type="checkbox"]');
        const checked = Boolean(checkbox?.checked);
        checkbox?.remove();
        return { clone, checked };
      };

      if (value === 'UL' || value === 'OL' || isChecklist) {
        sourceItems.forEach((item) => {
          const sourceItem = cloneListItem(item);
          const li = document.createElement('li');
          if (isChecklist) {
            li.className = sourceItem.checked ? 'task-item task-item-completed' : 'task-item';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'task-checkbox';
            checkbox.setAttribute('aria-label', '核对清单项');
            checkbox.checked = sourceItem.checked;
            li.appendChild(checkbox);
          }
          Array.from(sourceItem.clone.childNodes).forEach((node) => li.appendChild(node.cloneNode(true)));
          target.appendChild(li);
        });
      } else if (value === 'P' && quoted) {
        const blocks = document.createDocumentFragment();
        Array.from(source.children).forEach((child) => blocks.appendChild(child.cloneNode(true)));
        return blocks;
      } else if (value === 'BLOCKQUOTE') {
        target.appendChild(nestedList.cloneNode(true));
      } else if (value === 'P' && nestedList.matches('UL, OL')) {
        const paragraphs = document.createDocumentFragment();
        sourceItems.forEach((item) => {
          const sourceItem = cloneListItem(item);
          const paragraph = document.createElement('p');
          Array.from(sourceItem.clone.childNodes).forEach((node) => paragraph.appendChild(node.cloneNode(true)));
          paragraphs.appendChild(paragraph);
        });
        return paragraphs;
      } else {
        sourceItems.forEach((item, index) => {
          const sourceItem = cloneListItem(item);
          if (index) target.appendChild(document.createElement('br'));
          Array.from(sourceItem.clone.childNodes).forEach((node) => target.appendChild(node.cloneNode(true)));
        });
      }
      return target;
    }

    async function applySelectionFormat(value) {
      const state = restoreToolbarSelection(true);
      if (!state) return false;
      if (state.containers.length === 1) {
        state.container.replaceChildren(convertContainerFormat(state.container, value));
        const range = document.createRange();
        range.selectNodeContents(contentBlockElement(state.container));
        restoreSelection(range);
        state.container.dispatchEvent(new Event('input', { bubbles: true }));
        if (value === 'P' && state.container.children.length > 1) return saveActiveBlock(true);
        syncSelectionToolbar();
        return true;
      }
      if (!['UL', 'OL', 'TASK'].includes(value)) return false;
      const indexes = state.containers.map((container) => Number(container.dataset.blockIndex));
      const firstIndex = indexes[0];
      if (indexes.some((index, position) => index !== firstIndex + position)) return false;
      const lastIndex = indexes[indexes.length - 1];
      const first = state.containers[0];
      const firstBlock = app.blocks[firstIndex];
      const lastBlock = app.blocks[lastIndex];
      if (!firstBlock || !lastBlock) return false;

      const list = document.createElement(value === 'TASK' ? 'ul' : value.toLowerCase());
      if (value === 'TASK') list.className = 'task-list';
      state.containers.forEach((container) => {
        const converted = convertContainerFormat(container, value);
        Array.from(converted.children).forEach((item) => list.appendChild(item.cloneNode(true)));
      });
      const target = state.container;
      target.replaceChildren(list);
      if (target !== first) first.replaceWith(target);

      const previousContent = app.content;
      const lines = app.content.match(/[^\n]*\n|[^\n]+$/g) || [];
      lines.splice(firstBlock.start_line, lastBlock.end_line - firstBlock.start_line, serializeBlockContent(target));
      const content = lines.join('');
      if (content === previousContent) return false;
      clearTimeout(app.saveTimer);
      app.saveTimer = null;
      const editing = app.editing;
      try {
        await replaceDocument(content, false);
        if (app.editing !== editing) return false;
        state.containers.forEach((container) => {
          if (container !== target) container.remove();
        });
        Array.from(preview.querySelectorAll('.canvas-block')).forEach((block, index) => {
          block.dataset.blockIndex = String(index);
        });
        if (!editing) await beginBlockEdit(firstIndex);
        const activeBlock = app.blocks[firstIndex];
        if (app.editing && activeBlock) {
          app.editing.index = firstIndex;
          app.editing.startLine = activeBlock.start_line;
          app.editing.endLine = activeBlock.end_line;
          app.editing.content = serializeBlockContent(target);
        }
        const range = document.createRange();
        range.selectNodeContents(target);
        restoreSelection(range);
        selectionState = { ...state, crossBlock: false, container: target, containers: [target], range };
        recordEdit(previousContent, app.content);
        renderOutline();
        updateHistoryButtons();
        syncSelectionToolbar();
        setStatus('');
      } catch (error) {
        if (app.editing === editing) setStatus(error.message + '；请重新加载最新版本');
      }
      return true;
    }

    function restoreSelection(range) {
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function selectCanvasContent(container) {
      const range = document.createRange();
      range.selectNodeContents(container);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function selectionCovers(container) {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount !== 1) return false;
      const contents = document.createRange();
      contents.selectNodeContents(container);
      const selected = selection.getRangeAt(0);
      return selected.compareBoundaryPoints(Range.START_TO_START, contents) === 0
        && selected.compareBoundaryPoints(Range.END_TO_END, contents) === 0;
    }

    function caretAtStart(container) {
      const selection = window.getSelection();
      if (!selection?.rangeCount || !selection.isCollapsed) return false;
      const range = selection.getRangeAt(0);
      if (!container.contains(range.startContainer)) return false;
      const before = document.createRange();
      before.selectNodeContents(container);
      before.setEnd(range.startContainer, range.startOffset);
      return !before.toString();
    }

    function setCaretAfter(node) {
      const range = document.createRange();
      range.setStartAfter(node);
      range.collapse(true);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function mergeBlockAtStart(container, index) {
      const editing = app.editing;
      const previousBlock = app.blocks[index - 1];
      const currentBlock = app.blocks[index];
      const previous = preview.querySelector('[data-block-index="' + (index - 1) + '"]');
      const previousParagraph = previous?.children.length === 1 && previous.firstElementChild?.tagName === 'P'
        ? previous.firstElementChild
        : null;
      const currentParagraph = container.children.length === 1 && container.firstElementChild?.tagName === 'P'
        ? container.firstElementChild
        : null;
      if (!editing || editing.index !== index || !previousBlock || !currentBlock || !previousParagraph || !currentParagraph) return false;

      const mergedParagraph = previousParagraph.cloneNode(false);
      Array.from(previousParagraph.childNodes).forEach((node) => mergedParagraph.appendChild(node.cloneNode(true)));
      const breakNode = document.createElement('br');
      mergedParagraph.appendChild(breakNode);
      Array.from(currentParagraph.childNodes).forEach((node) => mergedParagraph.appendChild(node.cloneNode(true)));
      container.replaceChildren(mergedParagraph);
      previous.replaceWith(container);
      container.dataset.blockIndex = String(index - 1);
      editing.index = index - 1;
      editing.startLine = previousBlock.start_line;
      editing.endLine = currentBlock.end_line;
      editing.content = serializeBlockContent(container);
      editing.mergeBoundary = breakNode;
      editing.merging = true;
      clearTimeout(app.saveTimer);
      app.saveTimer = null;
      setCaretAfter(breakNode);
      container.dispatchEvent(new Event('input', { bubbles: true }));
      editing.merging = false;
      return true;
    }

    function removeMergeBoundary(container) {
      const editing = app.editing;
      const boundary = editing?.mergeBoundary;
      if (!editing || !boundary || !container.contains(boundary)) return false;
      const selection = window.getSelection();
      if (!selection?.rangeCount || !selection.isCollapsed) return false;
      const caret = document.createRange();
      caret.setStartAfter(boundary);
      caret.collapse(true);
      const current = selection.getRangeAt(0);
      if (current.startContainer !== caret.startContainer || current.startOffset !== caret.startOffset) return false;
      const parent = boundary.parentNode;
      const offset = Array.prototype.indexOf.call(parent.childNodes, boundary);
      boundary.remove();
      editing.mergeBoundary = null;
      const range = document.createRange();
      range.setStart(parent, Math.min(offset, parent.childNodes.length));
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
      container.dispatchEvent(new Event('input', { bubbles: true }));
      return true;
    }

    async function persistBlock(index, content, close = false) {
      const editing = app.editing;
      if (!editing || editing.index !== index) return false;
      if (editing.saving) {
        editing.pending = { content, close };
        return editing.saving;
      }
      const previousContent = app.content;
      const requestPromise = (async () => {
        editing.saving = true;
        setStatus('');
        try {
          const emptyDocument = editing.endLine === 0;
          const persistedContent = editing.emptyBodySlot && !content ? '\n' : content;
          const next = await request(emptyDocument ? '/api/document' : '/api/document/block', {
            method: 'POST',
            body: JSON.stringify(emptyDocument
              ? documentPayload({ content: persistedContent, base_revision: app.revision })
              : {
                  content: persistedContent,
                  start_line: editing.startLine,
                  end_line: editing.endLine,
                  base_revision: app.revision,
                  document_id: app.documentId
                })
          });
          if (app.editing !== editing) return true;
          recordEdit(previousContent, next.content);
          app.content = next.content;
          app.revision = next.revision;
          app.blocks = next.blocks || [];
          app.review = next.review || null;
          updateDocumentEntry(next);
          renderDocumentMenu();
          editing.endLine = editing.startLine + (persistedContent ? persistedContent.split(/\r?\n/).length - Number(persistedContent.endsWith('\n')) : 0);
          if (close || !app.blocks[editing.index]) {
            app.editing = null;
            renderBlocks();
          } else {
            renderOutline();
          }
          setStatus('');
          return true;
        } catch (error) {
          if (app.editing === editing) setStatus(error.message + '；请重新加载最新版本');
          return false;
        } finally {
          editing.saving = null;
          const pending = editing.pending;
          editing.pending = null;
          if (pending && app.editing === editing) await persistBlock(editing.index, pending.content, pending.close);
        }
      })();
      editing.saving = requestPromise;
      return requestPromise;
    }

    async function saveActiveBlock(close = true) {
      const editing = app.editing;
      if (!editing) return true;
      clearTimeout(app.saveTimer);
      app.saveTimer = null;
      const container = activeContainer();
      return persistBlock(editing.index, container ? serializeBlockContent(container) : editing.content, close);
    }

    async function save() {
      if (!app.editing) return true;
      return saveActiveBlock(true);
    }

    async function replaceDocument(content, render = true) {
      const next = await request('/api/document', {
        method: 'POST',
        body: JSON.stringify(documentPayload({ content, base_revision: app.revision }))
      });
      app.content = next.content;
      app.revision = next.revision;
      app.blocks = next.blocks || [];
      app.review = next.review || null;
      updateDocumentEntry(next);
      renderDocumentMenu();
      if (render) {
        app.editing = null;
        clearTimeout(app.saveTimer);
        app.saveTimer = null;
        renderBlocks();
      }
      updateHistoryButtons();
    }

    async function clearSelectedCanvas() {
      const previousContent = app.content;
      try {
        await replaceDocument('');
        recordEdit(previousContent, '');
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function importExampleContent(exampleId) {
      if (app.historyBusy || app.reviewBusy) return;
      try {
        closeMoreMenu();
        const { content } = await request(`/api/default?example=${encodeURIComponent(exampleId)}`);
        await createDocument(content);
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function importMarkdownContent(event) {
      const input = event.target;
      const file = input.files?.[0];
      input.value = '';
      if (!file) return;
      if (!file.name.toLowerCase().endsWith('.md')) {
        setStatus('请选择 .md 文件。');
        return;
      }
      try {
        await createDocument(await file.text());
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function applyHistory(direction) {
      if (app.historyBusy || !(await save())) return;
      const source = direction === 'undo' ? app.undoStack : app.redoStack;
      const target = source.pop();
      if (!target) {
        updateHistoryButtons();
        return;
      }
      const destination = direction === 'undo' ? app.redoStack : app.undoStack;
      destination.push(app.content);
      app.historyBusy = true;
      updateHistoryButtons();
      try {
        await replaceDocument(target);
        setStatus('');
      } catch (error) {
        source.push(target);
        destination.pop();
        setStatus(error.message);
      } finally {
        app.historyBusy = false;
        updateHistoryButtons();
      }
    }

    function cancelBlockEdit() {
      clearTimeout(app.saveTimer);
      app.saveTimer = null;
      if (!app.editing) return;
      app.editing.cancelled = true;
      app.editing = null;
      hideSelectionToolbar();
      renderBlocks();
      setStatus('');
    }

    async function resolveReview(action) {
      if (!app.review || app.reviewBusy) return;
      app.reviewBusy = true;
      app.stateRequestId += 1;
      updateHistoryButtons();
      const previousContent = app.content;
      try {
        const next = await request(`/api/review/${action}`, {
          method: 'POST',
          body: JSON.stringify(documentPayload(action === 'accept' ? { base_revision: app.revision } : {}))
        });
        app.stateRequestId += 1;
        applyState(next);
        if (action === 'accept') recordEdit(previousContent, next.content);
        setStatus('');
      } catch (error) {
        setStatus(error.message);
      } finally {
        app.reviewBusy = false;
        updateHistoryButtons();
      }
    }

    async function beginBlockEdit(index, event) {
      if (app.review) return;
      if (app.editing?.index === index) {
        const current = activeContainer();
        if (current) {
          const selectedRange = selectionRangeWithin(current);
          if (selectedRange) {
            restoreSelection(selectedRange);
          } else {
            current.focus({ preventScroll: true });
            placeCaretAtPoint(current, event);
          }
        }
        return;
      }
      const emptyBody = index === app.blocks.length && hasEmptyBodySlot();
      const clickedContainer = preview.querySelector('[data-block-index="' + index + '"]');
      const clickedHtml = emptyBody ? '' : clickedContainer ? blockHtmlForMatching(clickedContainer) : '';
      const clickedDomCount = preview.querySelectorAll('.canvas-block').length;
      const previousEditingIndex = app.editing?.index;
      if (app.editing && !(await saveActiveBlock(true))) return;
      const expectedIndex = emptyBody ? index : previousEditingIndex != null && index > previousEditingIndex
        ? index + app.blocks.length - clickedDomCount
        : index;
      if (!emptyBody && clickedHtml) {
        const matches = app.blocks
          .map((block, blockIndex) => block.html.trim() === clickedHtml ? blockIndex : -1)
          .filter((blockIndex) => blockIndex >= 0);
        index = matches.find((blockIndex) => blockIndex >= expectedIndex) ?? matches[0] ?? expectedIndex;
      } else {
        index = expectedIndex;
      }
      const block = app.blocks[index] || (emptyBody
        ? { start_line: 1, end_line: 2, content: '' }
        : (!app.blocks.length && index === 0
        ? { start_line: 0, end_line: 0, content: '' }
        : null));
      const container = preview.querySelector('[data-block-index="' + index + '"]');
      if (!block || !container) return;
      const selectedRange = selectionRangeWithin(container);
      app.editing = {
        index,
        emptyBodySlot: emptyBody,
        startLine: block.start_line,
        endLine: block.end_line,
        content: block.content,
        pending: null,
        saving: null,
        cancelled: false,
        mergeBoundary: null,
        merging: false
      };
      container.classList.add('editing');
      if (!app.blocks.length) {
        container.classList.remove('empty-state');
        container.replaceChildren(document.createElement('p'));
      }
      container.contentEditable = 'true';
      container.setAttribute('aria-label', '直接编辑此段内容');
      container.spellcheck = false;
      container.focus({ preventScroll: true });
      if (!placeCaretInEmptyParagraph(container)) {
        if (selectedRange) {
          restoreSelection(selectedRange);
          syncSelectionToolbar();
        } else {
          placeCaretAtPoint(container, event);
        }
      }
      container.addEventListener('beforeinput', () => placeCaretInEmptyParagraph(container));
      container.addEventListener('input', (event) => {
        const content = serializeBlockContent(container);
        app.editing.content = content;
        if (!app.editing.merging) app.editing.mergeBoundary = null;
        setStatus('');
        if (event.isComposing) return;
        clearTimeout(app.saveTimer);
        app.saveTimer = setTimeout(() => {
          app.saveTimer = null;
          void persistBlock(Number(container.dataset.blockIndex), serializeBlockContent(container));
        }, 450);
      });
      container.addEventListener('paste', (event) => {
        const text = event.clipboardData?.getData('text/plain');
        if (text == null) return;
        event.preventDefault();
        const selection = window.getSelection();
        if (!selection?.rangeCount) return;
        const range = selection.getRangeAt(0);
        range.deleteContents();
        const node = document.createTextNode(text.replace(/\r\n?/g, '\n'));
        range.insertNode(node);
        selection.collapse(node, node.length);
        container.dispatchEvent(new Event('input', { bubbles: true }));
      });
      container.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          cancelBlockEdit();
        } else if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'a') {
          event.preventDefault();
          selectCanvasContent(selectionCovers(container) ? preview : container);
        } else if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
          event.preventDefault();
          void saveActiveBlock(true);
        } else if (event.key === 'Delete' || event.key === 'Backspace') {
          if (selectionCovers(preview)) {
            event.preventDefault();
            void clearSelectedCanvas();
          } else {
            const index = Number(container.dataset.blockIndex);
            if (removeMergeBoundary(container) || (caretAtStart(container) && mergeBlockAtStart(container, index))) {
              event.preventDefault();
            }
          }
        } else if (event.key === 'Enter') {
          event.preventDefault();
          insertEditorBreak(container, !event.shiftKey);
        }
      });
      container.addEventListener('focusout', () => {
        const editing = app.editing;
        window.setTimeout(() => {
          if (!editing || editing.cancelled || app.editing !== editing
            || container.contains(document.activeElement) || selectionToolbar.contains(document.activeElement)) return;
          void saveActiveBlock(true);
        }, 0);
      });
    }

    async function handleCodeAction(event) {
      const action = event.target.closest?.('[data-code-action]');
      if (!action || !preview.contains(action)) return;
      event.preventDefault();
      event.stopPropagation();
      const actions = action.closest('[data-canvas-ui]');
      const pre = actions?.nextElementSibling;
      if (!pre || pre.tagName !== 'PRE') return;
      if (action.dataset.codeAction === 'copy') {
        await copyText(pre.textContent || '', '已复制代码块');
        return;
      }
      if (action.dataset.codeAction === 'wrap') {
        const wrapped = pre.classList.toggle('canvas-code-wrap');
        action.setAttribute('aria-pressed', String(wrapped));
        action.textContent = wrapped ? '取消换行' : '换行';
      }
    }

    function handleBlockClick(event) {
      if (app.review) return;
      if (event.target.closest?.('[data-code-action]')) return;
      if (event.target.closest('input[type="checkbox"]')) {
        event.stopPropagation();
        return;
      }
      if (event.target.closest('a')) return;
      const container = event.target.closest('.canvas-block');
      if (container) window.setTimeout(() => {
        if (currentSelectionContext()?.crossBlock) {
          syncSelectionToolbar();
          return;
        }
        void beginBlockEdit(Number(container.dataset.blockIndex), event);
      }, 0);
      else if (hasEmptyBodySlot()) window.setTimeout(() => void beginBlockEdit(1, event), 0);
    }

    async function handleCheckboxChange(event) {
      const checkbox = event.target.closest?.('input[type="checkbox"]');
      if (!checkbox || !preview.contains(checkbox)) return;
      if (app.review) {
        checkbox.checked = !checkbox.checked;
        return;
      }
      const container = checkbox.closest('.canvas-block');
      const index = Number(container?.dataset.blockIndex);
      if (!container || !Number.isInteger(index) || index < 0) return;
      const checked = checkbox.checked;
      const setCompleted = (target, value) => {
        target.closest('li.task-item')?.classList.toggle('task-item-completed', value);
      };
      const checkboxIndex = Array.from(container.querySelectorAll('input[type="checkbox"]')).indexOf(checkbox);
      if (checkboxIndex < 0) return;
      setCompleted(checkbox, checked);
      if (app.editing?.index !== index && !(await save())) {
        checkbox.checked = !checked;
        setCompleted(checkbox, !checked);
        return;
      }
      if (app.editing?.index !== index) {
        const nextContainer = preview.querySelector(`[data-block-index="${index}"]`);
        const nextCheckbox = nextContainer?.querySelectorAll('input[type="checkbox"]')[checkboxIndex];
        if (!nextCheckbox) {
          checkbox.checked = !checked;
          setCompleted(checkbox, !checked);
          return;
        }
        nextCheckbox.checked = checked;
        setCompleted(nextCheckbox, checked);
        await beginBlockEdit(index);
      }
      if (app.editing?.index === index) await saveActiveBlock(true);
    }

    function handleBlockKeydown(event) {
      if (app.review) return;
      const container = event.target.closest('.canvas-block');
      if (!container || event.target !== container || !['Enter', ' '].includes(event.key)) return;
      if (app.editing?.index === Number(container.dataset.blockIndex)) return;
      event.preventDefault();
      void beginBlockEdit(Number(container.dataset.blockIndex), event);
    }

    preview.addEventListener('click', handleCodeAction);
    preview.addEventListener('click', handleBlockClick);
    preview.addEventListener('change', handleCheckboxChange);
    document.addEventListener('pointerdown', (event) => {
      const current = activeContainer();
      const targetBlock = event.target.closest?.('.canvas-block');
      if (current && !current.contains(event.target) && !selectionToolbar.contains(event.target)
        && !(targetBlock && preview.contains(targetBlock))) {
        hideSelectionToolbar();
        void saveActiveBlock(true);
      }
    });

      documentMenuToggle.setAttribute('aria-expanded', String(opening));
    });
    archiveMenuToggle.addEventListener('click', () => {
      closeDocumentMenu();
      closeMoreMenu();
      const opening = archiveMenuOptions.hidden;
      archiveMenuOptions.hidden = !opening;
      archiveMenuToggle.setAttribute('aria-expanded', String(opening));
    });
    exportPdfButton.addEventListener('click', () => exportDocument('pdf', 'PDF'));
    exportMarkdownButton.addEventListener('click', () => exportDocument('markdown', 'MD'));
    document.addEventListener('click', (event) => {
      if (!event.target.closest('.more-menu')) closeMoreMenu();
      if (!event.target.closest('.document-menu')) closeDocumentMenu();
      if (!event.target.closest('.archive-menu')) closeArchiveMenu();
      if (!event.target.closest('.selection-format-menu-wrap')) closeSelectionFormatMenu();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeMoreMenu();
        closeDocumentMenu();
        closeArchiveMenu();
        closeSelectionFormatMenu();
      }
    });
    window.addEventListener('focus', () => { void syncCanvas(); });
    window.addEventListener('scroll', handleCanvasScroll, { passive: true });
    window.addEventListener('scroll', positionSelectionToolbar, { passive: true });
    window.addEventListener('resize', () => { scheduleOutlineActive(); positionSelectionToolbar(); });
    setInterval(() => void syncCanvas(), 2000);
    void syncCanvas();

    function closeMoreMenu() {
      moreOptions.hidden = true;
      moreToggleButton.setAttribute('aria-expanded', 'false');
      header.classList.remove('more-open');
    }

    function closeDocumentMenu() {
      documentMenuOptions.hidden = true;
      documentMenuToggle.setAttribute('aria-expanded', 'false');
    }

    function closeArchiveMenu() {
      archiveMenuOptions.hidden = true;
      archiveMenuToggle.setAttribute('aria-expanded', 'false');
    }

    async function exportDocument(format, label) {
      closeMoreMenu();
      if (!(await save())) return;
        setStatus(`正在导出 ${label}…`);
      try {
        const link = document.createElement('a');
        const query = app.documentId ? `?document_id=${encodeURIComponent(app.documentId)}` : '';
        link.href = `/api/export/${format}${query}`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setStatus(`已导出 ${label}`);
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function copyText(text, successMessage) {
      const fallbackCopy = () => {
        const fallback = document.createElement('textarea');
        fallback.value = text;
        fallback.setAttribute('readonly', '');
        fallback.style.position = 'fixed';
        fallback.style.opacity = '0';
        document.body.appendChild(fallback);
        fallback.select();
        const copied = document.execCommand('copy');
        fallback.remove();
        if (!copied) throw new Error('复制失败，请检查浏览器权限');
      };
      try {
        if (navigator.clipboard?.writeText) {
          try {
            await navigator.clipboard.writeText(text);
          } catch {
            fallbackCopy();
          }
        } else {
          fallbackCopy();
        }
      } catch {
        setStatus('复制失败，请检查浏览器权限');
        return false;
      }
      setStatus(successMessage);
      setTimeout(() => {
        if (status.textContent === successMessage) setStatus('');
      }, 1400);
      return true;
    }

    async function copyAllContent() {
      if (!(await save())) return;
      await copyText(app.content, '已复制全文');
    }

  </script>
</body>
</html>
